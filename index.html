<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
      initial-scale=1.0,
      maximum-scale=1.0,
      user-scalable=yes">

<title>Jahid Gaming - Tekken 3</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,body{
    width:100%;
    min-height:100%;
    background:#000;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    text-align:center;
    overflow-x:hidden;
}

/* HEADER */

.header{
    padding:14px 5px 8px;
}

.header h1{
    color:#ff3344;
    font-size:21px;
    font-weight:bold;
    text-shadow:0 0 10px #ff3344;
}

.subtitle{
    margin-top:5px;
    color:#aaa;
    font-size:12px;
}

/* BUTTON BAR */

.buttons{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:8px;
    flex-wrap:wrap;
    margin:8px 5px 12px;
}

.btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    padding:9px 15px;
    border:0;
    border-radius:25px;
    color:#fff;
    text-decoration:none;
    font-size:12px;
    font-weight:bold;
    cursor:pointer;
}

.play{
    background:#e9273f;
    box-shadow:0 0 10px rgba(233,39,63,.5);
}

.copy{
    background:#333;
}

.whatsapp{
    background:#20c763;
}

/* GAME AREA */

.game-area{
    width:100%;
    max-width:1000px;
    margin:auto;
    padding:0 4px;
}

.game-box{
    width:100%;
    height:calc(100vh - 150px);
    min-height:430px;
    background:#000;
    border:2px solid #222;
    border-radius:8px;
    overflow:hidden;
}

iframe{
    width:100%;
    height:100%;
    border:0;
    display:block;
}

/* INFO */

.info{
    padding:10px 5px 20px;
    color:#777;
    font-size:11px;
}

@media(max-width:600px){

    .header h1{
        font-size:18px;
    }

    .game-box{
        height:calc(100vh - 155px);
        min-height:420px;
    }

    .btn{
        padding:8px 12px;
        font-size:11px;
    }

}

</style>
</head>


<body>

<!-- HEADER -->

<div class="header">

    <h1>🔥 JAHID GAMING 🔥</h1>

    <div class="subtitle">
        TEKKEN 3 • PLAY ONLINE
    </div>

</div>


<!-- BUTTONS -->

<div class="buttons">

    <!-- OPEN GAME -->

    <a
        class="btn play"
        href="https://www.retrogames.cc/embed/40238-tekken-3.html"
        target="_blank"
        rel="noopener">

        🎮 OPEN TEKKEN 3

    </a>


    <!-- COPY LINK -->

    <button
        class="btn copy"
        onclick="copyLink()">

        📋 COPY LINK

    </button>


    <!-- WHATSAPP -->

    <a
        class="btn whatsapp"
        id="whatsappBtn"
        href="#"
        target="_blank"
        rel="noopener">

        💬 SHARE

    </a>

</div>


<!-- GAME PLAYER -->

<div class="game-area">

    <div class="game-box">

        <iframe
            src="https://www.retrogames.cc/embed/40238-tekken-3.html"
            title="Tekken 3"
            allow="autoplay; fullscreen; gamepad"
            allowfullscreen
            webkitallowfullscreen
            mozallowfullscreen
            scrolling="no">
        </iframe>

    </div>

</div>


<div class="info">
    🎮 Jahid Gaming • Tekken 3
</div>


<script>

/* COPY WEBSITE LINK */

function copyLink(){

    if(navigator.clipboard){

        navigator.clipboard.writeText(
            window.location.href
        ).then(function(){

            alert("✅ Link Copied!");

        });

    }else{

        alert("🔗 अपना website link copy कर लो।");

    }

}


/* WHATSAPP SHARE */

const shareMessage =
"🔥 Tekken 3 खेलने के लिए यह link खोलो:\n"
+ window.location.href;

document.getElementById("whatsappBtn").href =
"https://wa.me/?text="
+ encodeURIComponent(shareMessage);

</script>

</body>
</html>
