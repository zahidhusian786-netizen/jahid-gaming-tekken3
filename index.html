<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Jahid Gaming - Tekken 3 Lite</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: 'Segoe UI', Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            width: 100vw;
            overflow: hidden;
            padding: 2px;
        }
        .header {
            margin: 2px 0;
            text-align: center;
        }
        .header h1 {
            color: #ff3344;
            font-size: 15px;
            letter-spacing: 1px;
            text-transform: uppercase;
            text-shadow: 0 0 6px rgba(255, 51, 68, 0.8);
        }
        .action-bar {
            margin: 3px 0;
            display: flex;
            gap: 6px;
        }
        .btn {
            background: #ff3344;
            color: white;
            border: none;
            padding: 4px 10px;
            font-size: 10px;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
        }
        .btn-wa {
            background: #22c55e;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
        }
        /* Chhota banner taki game ke liye zyada jagah mile aur lag kam ho */
        .ad-banner-top {
            width: 100%;
            max-width: 300px;
            min-height: 50px;
            max-height: 90px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 2px;
            overflow: hidden;
        }
        .game-container {
            width: 100vw;
            flex-grow: 1;
            height: 82vh;
            background: #000000;
            border: none;
            position: relative;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
    </style>

    <!-- Adsterra Popunder Ad Script -->
    <script src="https://pl31029177.profitableratecpmnetwork.com/fe/a3/50/fea3508197e24a11b8b4bbeb12754b1c.js"></script>
</head>
<body>

    <div class="header">
        <h1>Jahid Gaming: Tekken 3</h1>
    </div>

    <!-- Action Buttons -->
    <div class="action-bar">
        <button class="btn" onclick="copyLink()">📋 Copy Link</button>
        <a href="https://wa.me/?text=" class="btn btn-wa" id="waSource" target="_blank">💬 Feedback</a>
    </div>

    <!-- Optimized Small Ad Banner to Reduce Lag -->
    <div class="ad-banner-top">
        <script type="text/javascript">
            atOptions = {
                'key' : 'a5e962e64f8e498dfa3c3d3685c23eef',
                'format' : 'iframe',
                'height' : 90,
                'width' : 728,
                'params' : {}
            };
        </script>
        <script type="text/javascript" src="https://www.highrevenueformat.com/a5e962e64f8e498dfa3c3d3685c23eef/invoke.js"></script>
    </div>

    <!-- Ultra Fast Low-Lag Tekken 3 Arcade Frame -->
    <div class="game-container">
        <iframe src="https://www.retrogames.cc/embed/40628-tekken-3.html" allowfullscreen="true" webkitallowfullscreen="true" mozallowfullscreen="true" scrolling="no"></iframe>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const currentUrl = encodeURIComponent(window.location.href);
            document.getElementById("waSource").href = `https://wa.me/?text=🔥%2520Bhai%2520Tekken%25203%2520yeh%2520dekh:%2520${currentUrl}`;
        });
        function copyLink() {
            navigator.clipboard.writeText(window.location.href);
            alert("🔗 Link Copied!");
        }
    </script>

</body>
</html>
