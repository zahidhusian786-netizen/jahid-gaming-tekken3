<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>Jahid Gaming - Tekken 3 Official</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: 'Segoe UI', Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            width: 100vw;
            overflow-y: auto;
            padding: 4px;
        }
        .header {
            margin: 6px 0;
            text-align: center;
        }
        .header h1 {
            color: #ff3344;
            font-size: 18px;
            letter-spacing: 1px;
            text-transform: uppercase;
            text-shadow: 0 0 8px rgba(255, 51, 68, 0.8);
        }
        .action-bar {
            margin: 6px 0;
            display: flex;
            gap: 8px;
        }
        .btn {
            background: #ff3344;
            color: white;
            border: none;
            padding: 6px 14px;
            font-size: 12px;
            font-weight: bold;
            border-radius: 15px;
            cursor: pointer;
        }
        .btn-wa {
            background: #22c55e;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
        }
        .ad-banner-top {
            width: 100%;
            max-width: 300px;
            min-height: 250px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 8px;
        }
        .game-container {
            width: 100%;
            max-width: 900px;
            height: 78vh;
            min-height: 480px;
            background: #000000;
            border: 2px solid #1e293b;
            border-radius: 10px;
            overflow: hidden;
            position: relative;
            margin-bottom: 20px;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
    </style>
