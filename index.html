<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Jahid Gaming - Tekken 3 Official Portal</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }
        body {
            background-color: #07090e;
            color: #ffffff;
            font-family: 'Segoe UI', Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            width: 100vw;
            overflow-x: hidden;
            padding: 4px;
        }
        .header {
            margin: 4px 0;
            text-align: center;
        }
        .header h1 {
            color: #ff3344;
            font-size: 18px;
            letter-spacing: 1.2px;
            text-transform: uppercase;
            text-shadow: 0 0 10px rgba(255, 51, 68, 0.8);
        }
        .header p {
            font-size: 11px;
            color: #94a3b8;
            margin-top: 2px;
        }
        /* Professional Action Bar */
        .action-bar {
            margin: 6px 0;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 6px;
            width: 100%;
            max-width: 600px;
        }
        .btn {
            background: linear-gradient(135deg, #ff3344, #cc1122);
            color: white;
            border: none;
            padding: 8px 14px;
            font-size: 11px;
            font-weight: bold;
            border-radius: 20px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(255, 51, 68, 0.4);
            display: flex;
            align-items: center;
            gap: 5px;
            transition: 0.2s;
            text-decoration: none;
        }
        .btn-wa {
            background: linear-gradient(135deg, #22c55e, #16a34a);
            box-shadow: 0 4px 12px rgba(34, 197, 94, 0.4);
        }
        .btn:active {
            transform: scale(0.95);
        }
        .ad-banner-top {
            width: 100%;
            max-width: 300px;
            min-height: 250px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 6px;
        }
        /* Game Container Optimized for Mobile & Curved Screens */
        .game-container {
            width: 100%;
            max-width: 1000px;
            flex-grow: 1;
            height: 72vh;
            min-height: 450px;
            background: #000000;
            border: 2px solid #1e293b;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.9), 0 0 15px rgba(255, 51, 68, 0.2);
            position: relative;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
        .footer-tip {
            font-size: 10px;
            color: #64748b;
            margin-top: 4px;
            text-align: center;
        }
    </style>

    <!-- Adsterra Popunder Ad Script -->
    <script src="https://pl31029177.profitableratecpmnetwork.com/fe/a3/50/fea3508197e24a11b8b4bbeb12754b1c.js"></script>
</head>
<body>

    <div class="header">
        <h1>Jahid Gaming: Tekken 3 Pro</h1>
        <p>🎮 Ultimate Retro Fighting Experience</p>
    </div>

    <!-- Professional Action Buttons -->
    <div class="action-bar">
        <button class="btn" onclick="copyLink()">📋 Copy Link</button>
        <button class="btn" onclick="shareSite()">🚀 Share Site</button>
        <a href="https://wa.me/?text=" class="btn btn-wa" id="waShare" target="_blank">💬 Chat / Feedback</a>
    </div>

    <!-- Banner Ad (300x250) -->
    <div class="ad-banner-top">
        <script type="text/javascript">
            atOptions = {
                'key' : 'a5e962e64f8e498dfa3c3d3685c23eef',
                'format' : 'iframe',
                'height' : 250,
                'width' : 300,
                'params' : {}
            };
        </script>
        <script type="text/javascript" src="https://www.highrevenueformat.com/a5e962e64f8e498dfa3c3d3685c23eef/invoke.js"></script>
    </div>

    <!-- Game Frame -->
    <div class="game-container">
        <iframe src="https://www.retrogames.cc/embed/41793-tekken-3.html" allowfullscreen="true" webkitallowfullscreen="true" mozallowfullscreen="true" scrolling="no"></iframe>
    </div>

    <div class="footer-tip">
        💡 Tip: Rotate your phone to Landscape mode for the best fullscreen experience!
    </div>

    <script>
        // Automatically attach current site link to WhatsApp chat button
        document.addEventListener("DOMContentLoaded", function() {
            const currentUrl = encodeURIComponent(window.location.href);
            const waBtn = document.getElementById("waShare");
            waBtn.href = `https://wa.me/?text=🔥%20Bhai%20is%20awesome%20Tekken%203%20game%20ko%20khel%20kar%20dekh!%20Ye%20raha%20link:%20${currentUrl}`;
        });

        function copyLink() {
            navigator.clipboard.writeText(window.location.href);
            alert("🔗 Website Link Copied Successfully!");
        }

        function shareSite() {
            if (navigator.share) {
                navigator.share({
                    title: 'Jahid Gaming - Tekken 3',
                    text: 'Play Tekken 3 online for free!',
                    url: window.location.href
                }).catch(console.error);
            } else {
                copyLink();
            }
        }
    </script>

</body>
</html>
