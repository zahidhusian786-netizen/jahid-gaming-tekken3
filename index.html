<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Jahid Gaming: Tekken 3</title>

<!-- Adsterra Popunder Ad (Balanced Limit) -->
<script src="https://pl31029177.profitableratecpmnetwork.com/fe/a3/50/fea3508197e24a11b8b4bbeb12754b1c.js"></script>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}
html, body {
    width: 100%;
    height: 100%;
    background: #000;
    color: #fff;
    font-family: Arial, sans-serif;
    overflow: hidden;
    position: fixed;
}

/* गेम को पूरी स्क्रीन पर फैलाने के लिए फुल-स्क्रीन व्यूपोर्ट */
.game-container {
    width: 100vw;
    height: 100vh;
    background: #000;
    position: absolute;
    top: 0;
    left: 0;
}

/* iframe को पूरी तरह स्ट्रेच करके काली पट्टी हटाने का कोड */
iframe {
    width: 100%;
    height: 100%;
    border: 0;
    display: block;
    object-fit: cover;
    transform: scale(1.08);
    transform-origin: center;
}
</style>
</head>

<body>

    <!-- Fullscreen Game Container (No black bars, pure game view) -->
    <div class="game-container">
        <iframe
            src="https://www.retrogames.cc/embed/40238-tekken-3.html"
            title="Tekken 3"
            allow="autoplay; fullscreen; gamepad; accelerometer; gyroscope"
            allowfullscreen
            webkitallowfullscreen
            mozallowfullscreen
            scrolling="no">
        </iframe>
    </div>

</body>
</html>
